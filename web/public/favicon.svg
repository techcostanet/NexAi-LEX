<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#D97706" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Base de Fundo Elegante Arredondada -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <!-- Balança da Justiça NexAi-LEX com Glow Dourado -->
  <g filter="url(#glow)" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Coluna Central e Cúpula -->
    <line x1="32" y1="14" x2="32" y2="48"/>
    <circle cx="32" cy="14" r="2.5" fill="url(#goldGrad)"/>
    <path d="M22 48h20"/>
    
    <!-- Barra Superior -->
    <line x1="16" y1="21" x2="48" y2="21"/>
    
    <!-- Prato Esquerdo -->
    <line x1="16" y1="21" x2="11" y2="33"/>
    <line x1="16" y1="21" x2="21" y2="33"/>
    <path d="M10 33c0 3.5 2.7 6 6 6s6-2.5 6-6H10z" fill="#D97706" fill-opacity="0.35"/>
    
    <!-- Prato Direito -->
    <line x1="48" y1="21" x2="43" y2="33"/>
    <line x1="48" y1="21" x2="53" y2="33"/>
    <path d="M42 33c0 3.5 2.7 6 6 6s6-2.5 6-6H42z" fill="#D97706" fill-opacity="0.35"/>
  </g>
</svg>